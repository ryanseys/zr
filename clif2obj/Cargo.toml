[package]
name = "clif2obj"
version = "0.1.0"
edition = "2024"
description = "CLIF text plus a data sidecar to a relocatable object, with Cranelift. ze0's optional native backend."
publish = false

[[bin]]
name = "clif2obj"
path = "src/main.rs"

[dependencies]
# One Cranelift release, pinned exactly; the five move together.
cranelift-codegen = { version = "=0.134.3", features = ["arm64"] }
cranelift-module = "=0.134.3"
cranelift-object = "=0.134.3"
cranelift-native = "=0.134.3"
cranelift-reader = "=0.134.3"
target-lexicon = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
