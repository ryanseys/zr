# Files that had lines over 150 characters when Layout/LineLength came in.
# Shorten the lines of a file, then delete it from this list.
Layout/LineLength:
  Exclude:
    - "lib/zr/backend/wasm/body.rb"
    - "lib/zr/backend/wasm/codegen.rb"
    - "lib/zr/eval/walk/tree.rb"
    - "lib/zr/hir.rb"
    - "lib/zr/hir/build.rb"
    - "lib/zr/hir/build/requires.rb"
    - "lib/zr/hir/dump.rb"
    - "lib/zr/hir/loader.rb"
    - "lib/zr/hir/patterns.rb"
    - "lib/zr/hir/preludes.rb"
    - "lib/zr/lower/function.rb"
    - "lib/zr/lower/function/control.rb"
    - "lib/zr/lower/function/expressions.rb"
    - "lib/zr/lower/scope.rb"
    - "lib/zr/machine/lower.rb"
    - "lib/zr/native/build.rb"
    - "lib/zr/obj/elf/object_file.rb"
    - "lib/zr/parse.rb"
    - "lib/zr/runtime.rb"
    - "test/spec/core/exception/exception_test.rb"
    - "test/spec/core/format/format_test.rb"
    - "test/support/harness/prism_diff.rb"
    - "test/support/harness/regexp_diff.rb"
    - "test/unit/escape_test.rb"
    - "test/unit/gc_trace_test.rb"
    - "test/unit/regalloc_differential_test.rb"
    - "tool/gen/enc_mb.rb"
    - "tool/gen/onig_encodings.rb"
    - "tool/gen/onig_unicode.rb"
    - "tool/gen/prism_encoding_tables.rb"
    - "tool/gen/zlib_tables.rb"
