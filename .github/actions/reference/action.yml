name: Reference ruby
description: >-
  Restores or installs the gems of the ruby that the tests compare with
  (tool/install_reference_gems.rb): the pinned ruby's bundled gems, and zr's
  versions of the gems whose C it ports, in tmp/reference. The key covers
  the lists that name them and the code that installs and finds them.
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: tmp/reference
        key: reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/zr/library/stdlib.rb', 'lib/zr/library/ports.rb', '.ruby-version', 'test/support/harness/reference.rb', 'tool/install_reference_gems.rb') }}
    - name: Install the reference ruby's gems
      shell: bash
      run: ruby tool/install_reference_gems.rb
