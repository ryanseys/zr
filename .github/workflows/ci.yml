name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The wasmtime of every job (test/support/harness/wasmtime.rb, VERSION).
env:
  WASMTIME_VERSION: 49.0.2

# A new push to a pull request stops the run of its previous push. A run
# on main always ends: the release workflow needs the result of each
# commit (.github/scripts/ci_passed.rb).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint and types read the files and run nothing, so they run on Linux.
  # steep.rb checks the kernel's other OS layers too (ZR_KERNEL_OS).
  lint:
    name: lint and types (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint
        run: bundle exec rake lint
      # `bin/steep check`, which also fails when a Steep worker stops.
      # A worker that stops can leave the check waiting, hence the limit.
      - name: Type check
        timeout-minutes: 10
        run: ruby .github/scripts/steep.rb --format=github

  macos:
    name: checks and gem (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - uses: ./.github/actions/runtime-cache
      - uses: ./.github/actions/reference
      # Under ZR_VERIFY=1 every IR function is checked for dominance and
      # operand types before it is assembled, and a pass that changed a
      # function without saying so is refused: the runtime's forty
      # thousand functions on the build, every program's on the tiers.
      - name: Build the runtime for the checks
        run: ZR_VERIFY=1 bundle exec rake build
      - name: Run every test
        run: ZR_VERIFY=1 bin/minitest
      # Every hit of the method cache checked against a fresh lookup,
      # over the program tests that exercise dispatch.
      - name: Run the dispatch tests with the method cache verified
        run: ZR_MCACHE=verify ZR_PROGRAMS=compiler/cache,compiler/fusion,lang/methods,lang/singleton,lang/refinements bin/minitest test/programs_test.rb
      # rubygems stamps a gem's files with SOURCE_DATE_EPOCH where it is
      # set, and with the clock where not; the commit's own time makes
      # the same commit build the same .gem.
      - name: Build the gem
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build zr.gemspec
      # The same install path on both hosts: the runtime carries its
      # source paths, so equal bytes need equal paths. The release
      # workflow runs the same script on the gem it publishes.
      - name: Install the gem and run it as a user would
        run: ruby .github/scripts/smoke.rb zr-*.gem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gem
          path: zr-*.gem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outputs-macos
          path: |
            /opt/zr/smoke/sum.wasm
            /opt/zr/smoke/sum.o
      # The runtime cache saves only what this run read.
      - name: Clean the cache of what this run did not use
        run: bin/zr cache clean --days 1

  # The compiler compiled by itself, twice, to the same bytes: the
  # proof that a build is a function of its inputs.
  stage1:
    name: stage 1 (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: ./.github/actions/runtime-cache
      - uses: ./.github/actions/reference
      - name: Build the runtime for the checks
        run: bundle exec rake build
      - run: bundle exec ruby tool/zr-dev.rb stage 1
      # The runtime cache saves only what this run read.
      - name: Clean the cache of what this run did not use
        run: bin/zr cache clean --days 1

  # Each generated file (tables, prism's Ruby, the docs pages) is what its
  # generator writes from the committed inputs. The generators of this
  # host's OS layer (libsystem, features, tables) are left out: their
  # output depends on the macOS release, and the unit tier and the
  # linux-musl job check them. redefinitions runs ruby once for each
  # core method, which takes too long here.
  generated:
    name: generated files are current (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Fetch the CRuby and prism sources that the generators read
        run: ruby .github/scripts/fetch_sources.rb
      # Outside bundler, as the linux-musl job runs `gen tables`: the nkf
      # generator reads the nkf gem, which ruby bundles and the Gemfile
      # does not list.
      - run: ruby tool/zr-dev.rb gen all --check --except libsystem,features,tables,redefinitions

  # The gem of the macos job, installed and run as a user would on other
  # hosts. On Linux, the script checks that zr writes a macOS binary,
  # refuses to run it (status 3), and never starts the self-build. A
  # stock-ruby row is a user's ruby: no Gemfile and no bundle, a clean
  # GEM_HOME, and no ZR_CACHE, so zr uses the user cache under HOME. The
  # install must fetch nothing. A row's name is its job's name
  # (.github/scripts/ci_passed.rb, CIJobs).
  gem:
    name: ${{ matrix.name }}
    needs: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gem on a host without native builds (Linux)
            os: ubuntu-24.04
            minutes: 20
            outputs: outputs-linux
          - name: stock ruby, user cache (macOS arm64)
            os: macos-15
            minutes: 90
            smoke: --user-cache
          - name: stock ruby, user cache (Linux)
            os: ubuntu-24.04
            minutes: 30
            smoke: --user-cache
    steps:
      # Only the smoke script: the gem under test comes from the macos job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gem
      - name: Install the gem and run it as a user would
        run: ruby .github/scripts/smoke.rb ${{ matrix.smoke }} zr-*.gem
      - if: matrix.outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.outputs }}
          path: |
            /opt/zr/smoke/sum.wasm
            /opt/zr/smoke/sum.o

  # Static aarch64-linux-musl binaries, built and run where musl is the
  # libc. JavaScript actions do not run inside an Alpine container on an
  # arm runner, so the job keeps one Alpine container beside it and runs
  # each step in it.
  linux-musl:
    name: aarch64-linux-musl (Alpine)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # BUNDLE_WITHOUT holds for each `docker exec`.
      - name: Start the pinned ruby (.ruby-version) on Alpine
        run: docker run -d --name alpine -e BUNDLE_WITHOUT=development -v "$PWD:/zr" -w /zr "ruby:$(cat .ruby-version)-alpine" sleep infinity
      - name: Install the C toolchain and git
        run: docker exec alpine apk add --no-cache build-base git
      - name: Let git read the checkout, which another user owns
        run: docker exec alpine git config --global --add safe.directory /zr
      - name: Install the bundle
        run: docker exec alpine bundle install
      - name: Install the reference gems
        run: docker exec alpine ruby tool/install_reference_gems.rb
      # A stock image of the pinned ruby: vendor/ must be upstream code, byte for
      # byte: ruby's own library at RUBY_REVISION, the .gem files that
      # vendor/vendor.lock names, and prism's templates at its locked commit. The
      # steps write vendor/ again from the sources, and fail on a diff.
      - name: Check vendor/ against its lock
        run: docker exec alpine ruby tool/zr-dev.rb vendor --check
      - name: Fetch the CRuby and prism sources
        run: docker exec alpine ruby .github/scripts/fetch_sources.rb
      - name: Write vendor/ again from the sources
        run: docker exec alpine ruby tool/zr-dev.rb vendor
      - name: Check that vendor/ is upstream code
        run: docker exec alpine git diff --exit-code vendor lib/zr/library/stdlib.rb
      - name: Build the runtime for the checks
        run: docker exec alpine bundle exec rake build
      - name: Run the units this target answers
        run: >-
          docker exec alpine bin/minitest
          test/unit/target_test.rb test/unit/elf_test.rb test/unit/interp_test.rb
          test/unit/os_api_test.rb test/unit/description_test.rb
      - name: Build and run whole programs for this target
        run: docker exec -e ZR_TARGET=aarch64-linux-musl -e ZR_PROGRAMS=cli alpine bin/minitest test/programs_test.rb
      # A slice of the program tests on this target: the dispatch and the
      # String tests, where a libc or a link difference would show.
      - name: Run a slice of the program tests for this target
        run: docker exec -e ZR_TARGET=aarch64-linux-musl -e ZR_PROGRAMS=lang/methods,core/string alpine bin/minitest test/programs_test.rb
      - name: Write the linux tables again and compare
        run: docker exec alpine ruby tool/zr-dev.rb gen tables --check

  wasi:
    name: wasm32-wasi (wasmtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - uses: ./.github/actions/runtime-cache
      - uses: ./.github/actions/reference
      - name: Build the runtime for the checks, and the wasm32-wasi one
        run: bundle exec rake build:all
      - name: Run the units this target answers
        run: >-
          bin/minitest
          test/unit/wasm_test.rb test/unit/wasm_locals_test.rb test/unit/os_api_test.rb
          test/unit/target_test.rb test/unit/description_test.rb
      - name: Build and run whole programs for this target
        run: ZR_TARGET=wasm32-wasi ZR_PROGRAMS=cli bin/minitest test/programs_test.rb
      # A slice of the program tests as modules under Winch: the dispatch,
      # Array and Hash tests. The whole tier is hours of wasmtime.
      - name: Run a slice of the program tests for this target
        run: ZR_TARGET=wasm32-wasi ZR_PROGRAMS=lang/methods,core/array,core/hash bin/minitest test/programs_test.rb
      # The runtime cache saves only what this run read.
      - name: Clean the cache of what this run did not use
        run: bin/zr cache clean --days 1

  same-bytes:
    name: output does not depend on the host
    needs: [macos, gem]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: outputs-macos
          path: macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: outputs-linux
          path: linux
      - run: |
          sha256sum macos/* linux/*
          cmp macos/sum.wasm linux/sum.wasm
          cmp macos/sum.o linux/sum.o
