name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: checks and gem (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
      - uses: ./.github/actions/runtime-cache
      - uses: ./.github/actions/reference
      - name: Lint
        run: bundle exec rake lint
      # Under ZR_VERIFY=1 every IR function is checked for dominance and
      # operand types before it is assembled, and a pass that changed a
      # function without saying so is refused: the runtime's forty
      # thousand functions on the build, every program's on the tiers.
      - name: Build the runtime for the checks
        run: ZR_VERIFY=1 bundle exec rake build
      - name: Run every test
        run: ZR_VERIFY=1 bundle exec rake test
      # Every hit of the method cache checked against a fresh lookup,
      # over the specs that exercise dispatch.
      - name: Run the dispatch specs with the method cache verified
        run: ZR_MCACHE=verify bundle exec bin/test test/spec/compiler/cache test/spec/compiler/fusion test/spec/lang/methods test/spec/lang/singleton test/spec/lang/refinements
      # rubygems stamps a gem's files with SOURCE_DATE_EPOCH where it is
      # set, and with the clock where not; the commit's own time makes
      # the same commit build the same .gem.
      - name: Build the gem
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build zr.gemspec
      # The same install path on both hosts: the runtime carries its
      # source paths, so equal bytes need equal paths. The release
      # workflow runs the same script on the gem it publishes.
      - name: Install the gem and run it as a user would
        run: ruby .github/scripts/smoke.rb zr-*.gem /opt/zr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gem
          path: zr-*.gem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outputs-macos
          path: |
            /opt/zr/smoke/sum.wasm
            /opt/zr/smoke/sum.o

  # The compiler compiled by itself, twice, to the same bytes: the
  # proof that a build is a function of its inputs.
  stage1:
    name: stage 1 (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: ./.github/actions/runtime-cache
      - uses: ./.github/actions/reference
      - name: Build the runtime for the checks
        run: bundle exec rake build
      - run: bundle exec ruby tool/zr-dev.rb stage 1
      # The tools, compiled by zr: they must build, and answer as they do
      # under ruby. A zr binary reads RUBYOPT, so it runs outside the bundle.
      - name: Build the tools with zr and check them against ruby
        run: |
          bundle exec rake build:tools
          bin/zr-dev help
          bin/zr-dev spec check test/spec/core/string
          cmp <(bin/zr-dev spec fingerprint test/spec/core/string) <(ruby tool/zr-dev.rb spec fingerprint test/spec/core/string)
          bin/zr-dev cache live

  # One program built from two copies of the tree at two paths, under
  # another home, clock zone, locale and job count, with one path root:
  # the proof that a build does not read where it ran.
  repro:
    name: two checkouts, one output (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec ruby tool/zr-dev.rb repro

  linux:
    name: gem on a host without native builds (Linux)
    needs: macos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Only the smoke script: the gem under test comes from the macos job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "4.0.7"
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gem
      # The script checks that this host writes a macOS binary, refuses
      # to run it (status 3), and never starts the self-build.
      - name: Install the gem and run it as a user would
        run: ruby .github/scripts/smoke.rb zr-*.gem /opt/zr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outputs-linux
          path: |
            /opt/zr/smoke/sum.wasm
            /opt/zr/smoke/sum.o

  # Static aarch64-linux-musl binaries, built and run where musl is the
  # libc. JavaScript actions do not run inside an Alpine container on an
  # arm runner, so the job keeps one Alpine container beside it and runs
  # each step in it.
  linux-musl:
    name: aarch64-linux-musl (Alpine)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start ruby 4.0.7 on Alpine
        run: |
          docker run -d --name alpine -v "$PWD:/zr" -w /zr ruby:4.0.7-alpine sleep infinity
          docker exec alpine apk add --no-cache build-base git
          docker exec alpine git config --global --add safe.directory /zr
          docker exec alpine bundle config set --global without development
          docker exec alpine bundle install
          docker exec alpine ruby tool/zr-dev.rb reference
      # A stock ruby 4.0.7 image: zr's standard library (stdlib/) must be
      # this ruby's own library, byte for byte, and the bundled gems must be
      # the .gem files of CRuby's gems/bundled_gems at RUBY_REVISION.
      - name: Check that stdlib/ is stock ruby 4.0.7
        run: |
          docker exec alpine sh -c 'rev="$(ruby -Ilib -rzr/version -e "print Zr::RUBY_REVISION")" &&
            git init -q /tmp/ruby && git -C /tmp/ruby fetch -q --depth 1 https://github.com/ruby/ruby.git "$rev" &&
            RUBY_SRC=/tmp/ruby ruby tool/zr-dev.rb gen stdlib --check'
      - name: Build the runtime for the checks
        run: docker exec alpine bundle exec rake build
      - name: Run the units this target answers
        run: >-
          docker exec alpine bundle exec bin/test
          test/unit/target_test.rb test/unit/elf_test.rb test/unit/interp_test.rb
          test/unit/os_api_test.rb test/unit/description_test.rb
      - name: Build and run whole programs for this target
        run: docker exec -e TARGET=aarch64-linux-musl alpine bundle exec rake test:e2e
      # A slice of the spec tier on this target: the dispatch and the
      # String specs, where a libc or a link difference would show.
      - name: Run a slice of the specs for this target
        run: docker exec -e TARGET=aarch64-linux-musl alpine bundle exec bin/test test/spec/lang/methods test/spec/core/string
      - name: Write the linux tables again and compare
        run: |
          docker exec alpine wget -qO /tmp/mkconstants.rb https://raw.githubusercontent.com/ruby/ruby/229531a6cfbf07e3caef30dbac24a2a3f3fed482/ext/socket/mkconstants.rb
          docker exec -e MKCONSTANTS=/tmp/mkconstants.rb alpine ruby tool/zr-dev.rb gen tables --check

  wasi:
    name: wasm32-wasi (wasmtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
      - uses: ./.github/actions/runtime-cache
      - uses: ./.github/actions/reference
      - name: Build the runtime for the checks, and the wasm32-wasi one
        run: bundle exec rake build:all
      - name: Run the units this target answers
        run: >-
          bundle exec bin/test
          test/unit/wasm_test.rb test/unit/wasm_locals_test.rb test/unit/os_api_test.rb
          test/unit/target_test.rb test/unit/description_test.rb
      - name: Build and run whole programs for this target
        run: TARGET=wasm32-wasi bundle exec rake test:e2e
      # A slice of the spec tier as modules under Winch: the dispatch,
      # Array and Hash specs. The whole tier is hours of wasmtime.
      - name: Run a slice of the specs for this target
        run: TARGET=wasm32-wasi bundle exec bin/test test/spec/lang/methods test/spec/core/array test/spec/core/hash

  same-bytes:
    name: output does not depend on the host
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: outputs-macos
          path: macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: outputs-linux
          path: linux
      - run: |
          sha256sum macos/* linux/*
          cmp macos/sum.wasm linux/sum.wasm
          cmp macos/sum.o linux/sum.o
