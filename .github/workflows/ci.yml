name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: checks and gem (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # The runtime caches -- the object, the images, the road, the wasm
      # prelude -- kept between runs under the digest's inputs, so a run
      # whose lib and rt did not move skips the build's minutes. Not the
      # unit, parse and binary caches, which are gigabytes.
      - uses: actions/cache@v4
        with:
          path: |
            tmp/rt/rt-*.o
            tmp/rt/prelink-*.bin
            tmp/rt/skeleton-*.bin
            tmp/rt/road-*
            tmp/rt/wasm-*.marshal
            tmp/rt/built-*.ok
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/**', 'rt/**', '.ruby-version') }}
      # Under ZR_VERIFY=1 every IR function is checked for dominance and
      # operand types before it is assembled, and a pass that changed a
      # function without saying so is refused: the runtime's forty
      # thousand functions on the build, every program's on the tiers.
      - name: Build the runtime for the checks
        run: ZR_VERIFY=1 bundle exec rake build
      - name: Run every test
        run: ZR_VERIFY=1 bundle exec rake test
      # Every hit of the method cache checked against a fresh lookup,
      # over the specs that exercise dispatch.
      - name: Run the dispatch specs with the method cache verified
        run: ZR_MCACHE=verify bundle exec rake test test/spec/compiler/cache test/spec/compiler/fusion test/spec/lang/methods test/spec/lang/singleton test/spec/lang/refinements
      # rubygems stamps a gem's files with SOURCE_DATE_EPOCH where it is
      # set, and with the clock where not; the commit's own time makes
      # the same commit build the same .gem.
      - name: Build the gem
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build zr.gemspec
      # The same install path on both hosts: the runtime carries its
      # source paths, so equal bytes need equal paths.
      - name: Install the gem
        run: |
          sudo mkdir -p /opt/zr && sudo chown "$USER" /opt/zr
          GEM_HOME=/opt/zr/gems gem install --local ./zr-*.gem
      - name: Smoke-run the installed gem
        run: |
          mkdir -p /opt/zr/smoke && cd /opt/zr/smoke
          printf 'puts [1, 2, 3].sum\n' > sum.rb
          export GEM_HOME=/opt/zr/gems ZR_CACHE=/opt/zr/cache
          test "$(/opt/zr/gems/bin/zr run sum.rb)" = 6
          /opt/zr/gems/bin/zr build sum.rb -o sum.wasm --emit wasm
          /opt/zr/gems/bin/zr build sum.rb -o sum.o --emit obj
          test "$(wasmtime sum.wasm)" = 6
      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: zr-*.gem
      - uses: actions/upload-artifact@v4
        with:
          name: outputs-macos
          path: |
            /opt/zr/smoke/sum.wasm
            /opt/zr/smoke/sum.o

  # The compiler compiled by itself, twice, to the same bytes: the
  # proof that a build is a function of its inputs.
  stage1:
    name: stage 1 (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: |
            tmp/rt/rt-*.o
            tmp/rt/prelink-*.bin
            tmp/rt/skeleton-*.bin
            tmp/rt/road-*
            tmp/rt/wasm-*.marshal
            tmp/rt/built-*.ok
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/**', 'rt/**', '.ruby-version') }}
      - name: Build the runtime for the checks
        run: bundle exec rake build
      - run: bundle exec rake stage1

  # One program built from two copies of the tree at two paths, under
  # another home, clock zone, locale and job count, with one path root:
  # the proof that a build does not read where it ran.
  repro:
    name: two checkouts, one output (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rake repro

  linux:
    name: gem on a host without native builds (Linux)
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: actions/download-artifact@v4
        with:
          name: gem
      - name: Install the gem
        run: |
          sudo mkdir -p /opt/zr && sudo chown "$USER" /opt/zr
          GEM_HOME=/opt/zr/gems gem install --local ./zr-*.gem
      - name: Build wasm and obj, and refuse a native binary
        run: |
          mkdir -p /opt/zr/smoke && cd /opt/zr/smoke
          printf 'puts [1, 2, 3].sum\n' > sum.rb
          export GEM_HOME=/opt/zr/gems ZR_CACHE=/opt/zr/cache
          /opt/zr/gems/bin/zr build sum.rb -o sum.wasm --emit wasm
          /opt/zr/gems/bin/zr build sum.rb -o sum.o --emit obj
          test "$(wasmtime sum.wasm)" = 6
          set +e
          /opt/zr/gems/bin/zr build sum.rb -o sum
          status=$?
          set -e
          test "$status" = 3
      - uses: actions/upload-artifact@v4
        with:
          name: outputs-linux
          path: |
            /opt/zr/smoke/sum.wasm
            /opt/zr/smoke/sum.o

  # Static aarch64-linux-musl binaries, built and run where musl is the
  # libc. JavaScript actions do not run inside an Alpine container on an
  # arm runner, so the job keeps one Alpine container beside it and runs
  # each step in it.
  linux-musl:
    name: aarch64-linux-musl (Alpine)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Start ruby 4.0.6 on Alpine
        run: |
          docker run -d --name alpine -v "$PWD:/zr" -w /zr ruby:4.0.6-alpine sleep infinity
          docker exec alpine apk add --no-cache build-base git
          docker exec alpine git config --global --add safe.directory /zr
          docker exec alpine bundle config set --global without development
          docker exec alpine bundle install
      - name: Build the runtime for the checks
        run: docker exec alpine bundle exec rake build
      - name: Run the units this target answers
        run: >-
          docker exec alpine bundle exec rake test
          test/unit/target_test.rb test/unit/elf_test.rb test/unit/interp_test.rb
          test/unit/os_api_test.rb test/unit/description_test.rb
      - name: Build and run whole programs for this target
        run: docker exec -e TARGET=aarch64-linux-musl alpine bundle exec rake test:e2e
      # A slice of the spec tier on this target: the dispatch and the
      # String specs, where a libc or a link difference would show.
      - name: Run a slice of the specs for this target
        run: docker exec -e TARGET=aarch64-linux-musl alpine bundle exec rake test test/spec/lang/methods test/spec/core/string
      - name: Write the linux tables again and compare
        run: |
          docker exec alpine wget -qO /tmp/mkconstants.rb https://raw.githubusercontent.com/ruby/ruby/03b6d3f8898a28604fe6cb00eae3226b821168f4/ext/socket/mkconstants.rb
          docker exec -e MKCONSTANTS=/tmp/mkconstants.rb alpine bundle exec rake tables

  wasi:
    name: wasm32-wasi (wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # The runtime caches, kept between runs under the digest's inputs:
      # a run whose lib and rt did not move skips the build's minutes.
      - uses: actions/cache@v4
        with:
          path: |
            tmp/rt/rt-*.o
            tmp/rt/prelink-*.bin
            tmp/rt/skeleton-*.bin
            tmp/rt/road-*
            tmp/rt/wasm-*.marshal
            tmp/rt/built-*.ok
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/**', 'rt/**', '.ruby-version') }}
      - name: Build the runtime for the checks, and the wasm32-wasi one
        run: bundle exec rake build:all
      - name: Run the units this target answers
        run: >-
          bundle exec rake test
          test/unit/wasm_test.rb test/unit/wasm_locals_test.rb test/unit/os_api_test.rb
          test/unit/target_test.rb test/unit/description_test.rb
      - name: Build and run whole programs for this target
        run: TARGET=wasm32-wasi bundle exec rake test:e2e
      # A slice of the spec tier as modules under Winch: the dispatch,
      # Array and Hash specs. The whole tier is hours of wasmtime.
      - name: Run a slice of the specs for this target
        run: TARGET=wasm32-wasi bundle exec rake test test/spec/lang/methods test/spec/core/array test/spec/core/hash

  same-bytes:
    name: output does not depend on the host
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: outputs-macos
          path: macos
      - uses: actions/download-artifact@v4
        with:
          name: outputs-linux
          path: linux
      - run: |
          sha256sum macos/* linux/*
          cmp macos/sum.wasm linux/sum.wasm
          cmp macos/sum.o linux/sum.o
