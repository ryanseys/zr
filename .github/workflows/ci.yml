name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: checks and gem (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Run every test
        run: bundle exec rake test
      - name: Build the gem
        run: gem build ze0.gemspec
      # The same install path on both hosts: the runtime carries its
      # source paths, so equal bytes need equal paths.
      - name: Install the gem
        run: |
          sudo mkdir -p /opt/ze0 && sudo chown "$USER" /opt/ze0
          GEM_HOME=/opt/ze0/gems gem install --local ./ze0-*.gem
      - name: Smoke-run the installed gem
        run: |
          mkdir -p /opt/ze0/smoke && cd /opt/ze0/smoke
          printf 'puts [1, 2, 3].sum\n' > sum.rb
          export GEM_HOME=/opt/ze0/gems ZE0_CACHE=/opt/ze0/cache
          test "$(/opt/ze0/gems/bin/ze0 run sum.rb)" = 6
          /opt/ze0/gems/bin/ze0 build sum.rb -o sum.wasm --emit wasm
          /opt/ze0/gems/bin/ze0 build sum.rb -o sum.o --emit obj
          test "$(wasmtime sum.wasm)" = 6
      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: ze0-*.gem
      - uses: actions/upload-artifact@v4
        with:
          name: outputs-macos
          path: |
            /opt/ze0/smoke/sum.wasm
            /opt/ze0/smoke/sum.o

  linux:
    name: gem on a host without native builds (Linux)
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: actions/download-artifact@v4
        with:
          name: gem
      - name: Install the gem
        run: |
          sudo mkdir -p /opt/ze0 && sudo chown "$USER" /opt/ze0
          GEM_HOME=/opt/ze0/gems gem install --local ./ze0-*.gem
      - name: Build wasm and obj, and refuse a native binary
        run: |
          mkdir -p /opt/ze0/smoke && cd /opt/ze0/smoke
          printf 'puts [1, 2, 3].sum\n' > sum.rb
          export GEM_HOME=/opt/ze0/gems ZE0_CACHE=/opt/ze0/cache
          /opt/ze0/gems/bin/ze0 build sum.rb -o sum.wasm --emit wasm
          /opt/ze0/gems/bin/ze0 build sum.rb -o sum.o --emit obj
          test "$(wasmtime sum.wasm)" = 6
          set +e
          /opt/ze0/gems/bin/ze0 build sum.rb -o sum
          status=$?
          set -e
          test "$status" = 3
      - uses: actions/upload-artifact@v4
        with:
          name: outputs-linux
          path: |
            /opt/ze0/smoke/sum.wasm
            /opt/ze0/smoke/sum.o

  # Static aarch64-linux-musl binaries, built and run where musl is the
  # libc. JavaScript actions do not run inside an Alpine container on an
  # arm runner, so the job keeps one Alpine container beside it and runs
  # each step in it.
  linux-musl:
    name: aarch64-linux-musl (Alpine)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Start ruby 4.0.6 on Alpine
        run: |
          docker run -d --name alpine -v "$PWD:/ze0" -w /ze0 ruby:4.0.6-alpine sleep infinity
          docker exec alpine apk add --no-cache build-base git
          docker exec alpine git config --global --add safe.directory /ze0
          docker exec alpine bundle config set --global without development
          docker exec alpine bundle install
      - name: Run the units this target answers
        run: docker exec alpine bundle exec rake test:unit FILTER="target elf interp os_api description case_format"
      - name: Build and run whole programs for this target
        run: docker exec -e TARGET=aarch64-linux-musl alpine bundle exec rake test:e2e
      - name: Write the linux tables again and compare
        run: |
          docker exec alpine wget -qO /tmp/mkconstants.rb https://raw.githubusercontent.com/ruby/ruby/03b6d3f8898a28604fe6cb00eae3226b821168f4/ext/socket/mkconstants.rb
          docker exec -e MKCONSTANTS=/tmp/mkconstants.rb alpine bundle exec rake tables

  wasi:
    name: wasm32-wasi (wasmtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Run the units this target answers
        run: bundle exec rake test:unit FILTER="wasm os_api target description case_format"
      - name: Build and run whole programs for this target
        run: TARGET=wasm32-wasi bundle exec rake test:e2e

  same-bytes:
    name: output does not depend on the host
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: outputs-macos
          path: macos
      - uses: actions/download-artifact@v4
        with:
          name: outputs-linux
          path: linux
      - run: |
          sha256sum macos/* linux/*
          cmp macos/sum.wasm linux/sum.wasm
          cmp macos/sum.o linux/sum.o
