name: CI

# The checks and the gem first. Then one lane for each target
# (.github/workflows/lane.yml, .github/scripts/lanes.rb): its runtime,
# built once and exported, then its unit files and its programs; on the
# nightly run and a run by hand, every program, in shards. The unit
# files that need no runtime run once beside the lanes. The gem runs as
# a user installs it on each kind of host. `ci-ok` is the one check that
# branch protection and the release (.github/scripts/ci_passed.rb)
# require.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

# `actions: read` lets a job download this run's runtime bundles.
permissions:
  contents: read
  actions: read

# The wasmtime of every job (test/support/harness/wasmtime.rb, VERSION).
env:
  WASMTIME_VERSION: 49.0.2

# A new push to a pull request or to main stops the run of the previous
# push there. The nightly run and a run by hand have a group of their
# own, so neither is dropped: to release a commit whose run a later
# push stopped, run CI on it by hand (docs/how-to/release.md). A group
# for each commit would not stop a push and a run by hand of one commit
# from both building every runtime: the second run would wait and then
# do the same work, or stop the full run, and a waiting run can replace
# another. Instead, a push or nightly run that a full run of its commit
# replaces builds and tests nothing (.github/scripts/changes.rb).
concurrency:
  group: ${{ contains(fromJSON('["push", "pull_request"]'), github.event_name) && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ contains(fromJSON('["push", "pull_request"]'), github.event_name) }}

jobs:
  # What this run checks (.github/scripts/changes.rb): code (false for a
  # docs-only pull request), full (the full suite) and the pinned ruby.
  # Then the docs, and RuboCop and Steep, which report their findings as
  # annotations and never fail the run. Then the gem, as the release
  # builds it: rubygems stamps a gem's files with SOURCE_DATE_EPOCH, so
  # the same commit gives the same .gem.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `actions: read` lists the other runs of this commit (changes.rb).
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      full: ${{ steps.changes.outputs.full }}
      ruby: ${{ steps.changes.outputs.ruby }}
      lanes: ${{ steps.lanes.outputs.lanes }}
      gem: ${{ steps.gem.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/changes.rb
      - uses: ./.github/actions/setup
        with:
          wasmtime: "false"
      - id: lanes
        name: The lanes of the targets
        run: echo "lanes=$(ruby .github/scripts/lanes.rb matrix)" >> "$GITHUB_OUTPUT"
      - name: RuboCop (report only)
        continue-on-error: true
        run: bundle exec rubocop --format github --format progress
      # A Steep worker that stops can leave the check waiting, hence the limit.
      - name: Steep (report only)
        continue-on-error: true
        timeout-minutes: 15
        run: ruby .github/scripts/steep.rb --format=github
      - name: Check the links, the changelog, the layout and the notices
        run: >-
          bin/minitest
          test/unit/readme_test.rb test/unit/changelog_test.rb test/unit/layout_test.rb
          test/unit/environment_variables_test.rb test/unit/notices_test.rb
      - name: Fetch the CRuby and prism sources that the generators read
        run: ruby .github/scripts/fetch_sources.rb
      # Report only, as RuboCop and Steep: a page that its generator would
      # write again is a warning to run `zr-dev gen`, not a reason to stop
      # the gem, the lanes and the release.
      - name: The generated pages are current (report only)
        continue-on-error: true
        run: |
          stale=0
          for page in capi perf targets; do
            ruby tool/zr-dev.rb gen "$page" --check || { echo "::warning::run 'bin/zr-dev gen $page': its page is out of date"; stale=1; }
          done
          exit "$stale"
      - id: gem
        if: steps.changes.outputs.code == 'true'
        name: Build the gem
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build zr.gemspec
          echo "sha256=$(sha256sum zr-*.gem | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem
          path: zr-*.gem
          retention-days: 90

  # The unit files that need no runtime and no kind of host
  # (.github/scripts/lanes.rb, `untagged`): once, on Linux, beside the
  # lanes.
  units:
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Some units read CRuby's sources (zr-dev's generators).
      - name: Fetch the CRuby and prism sources that the generators read
        run: ruby .github/scripts/fetch_sources.rb
      - name: Units that need no runtime
        run: ruby .github/scripts/lanes.rb untagged --run
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-units
          path: log/minitest
          retention-days: 7

  # One lane for each target (.github/workflows/lane.yml): its runtime,
  # then its unit files and programs, each lane on its own.
  lane:
    name: ${{ matrix.lane.triple }}
    needs: checks
    if: needs.checks.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.checks.outputs.lanes) }}
    uses: ./.github/workflows/lane.yml
    with:
      lane: ${{ toJSON(matrix.lane) }}
      full: ${{ needs.checks.outputs.full == 'true' }}
      ruby: ${{ needs.checks.outputs.ruby }}

  # The gem of the `checks` job as a user installs it, on macOS and on
  # Linux. First into /opt/zr with the runtimes of this run imported: a
  # runtime has no path of its install, so a build for an imported target
  # builds none (`--import`). Its outputs go to ci-ok, which compares the
  # hosts. Then, on Linux, on stock ruby 4.0, the oldest that runs zr
  # (Zr::RUBY_MINIMUM): no Gemfile and no bundle, a clean GEM_HOME, and
  # no ZR_CACHE, so zr builds its runtime in the user cache under HOME.
  smoke:
    name: gem (${{ matrix.host }})
    needs: [checks, lane]
    # Not after a failed `checks`: then no lane ran, and there is no gem
    # or runtime to install. ci-ok names the failed `checks`.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macOS arm64
            os: macos-26
            runtimes: aarch64-apple-darwin wasm32-wasi
            outputs: outputs-macos
          - host: arm64 Linux
            os: ubuntu-24.04-arm
            runtimes: aarch64-linux-gnu wasm32-wasi
            outputs: outputs-linux-aarch64
    steps:
      # Only the smoke script: the gem under test comes from `checks`.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/setup
        with:
          bundle: "false"
      - name: Download the gem and this host's runtimes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n gem
          for triple in ${{ matrix.runtimes }}; do
            gh run download "$GITHUB_RUN_ID" -n "runtime-$triple" -D "lane-$triple" ||
              { echo "::error::no runtime-$triple artifact: the $triple runtime job did not pass"; exit 1; }
          done
      - name: Install the gem with this run's runtimes
        run: |
          imports=()
          for triple in ${{ matrix.runtimes }}; do imports+=(--import "lane-$triple/runtime-$triple.tar.gz"); done
          ruby .github/scripts/smoke.rb "${imports[@]}" zr-*.gem
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.outputs }}
          path: |
            /opt/zr/smoke/sum.wasm
            /opt/zr/smoke/sum.darwin.o
      - if: matrix.os == 'ubuntu-24.04-arm'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
      - name: Install the gem on stock ruby 4.0, with a user cache
        if: matrix.os == 'ubuntu-24.04-arm'
        run: ruby .github/scripts/smoke.rb --user-cache zr-*.gem

  # The one required check. It passes when no job that this run started
  # failed: a job that a docs-only change or a run without the full suite
  # skips is not a failure, and an experimental row's failure does not
  # count (continue-on-error). Then the outputs of macOS and Linux must be
  # the same bytes, and so must the gem that each builds.
  ci-ok:
    if: always()
    needs: [checks, units, lane, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          bad="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')"
          [ -z "$bad" ] || { echo "::error::did not pass: $bad"; exit 1; }
      - if: needs.checks.outputs.code == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{outputs-*,gem-macos-sha256}"
      - if: needs.checks.outputs.code == 'true'
        name: The output does not depend on the host
        env:
          LINUX_GEM: ${{ needs.checks.outputs.gem }}
        run: |
          sha256sum outputs-*/*
          cmp outputs-macos/sum.wasm outputs-linux-aarch64/sum.wasm
          cmp outputs-macos/sum.darwin.o outputs-linux-aarch64/sum.darwin.o
          test "$(cat gem-macos-sha256/gem-macos.sha256)" = "$LINUX_GEM"

  # Release: after a run on main (or on a tag, which `gh workflow run
  # ci.yml --ref vX.Y.Z` makes), a GitHub prerelease of the commit,
  # v<version>.g<sha7>, with the files that this run tested: the `ruby`
  # gem of `checks`; the runtime bundle of each lane whose tests passed
  # (its `passed-<triple>` marker), by the name that `zr cache fetch`
  # reads; for each such lane of a host, the platform gem that carries
  # that bundle (zr.gemspec, ZR_GEM_PLATFORM); and SHA256SUMS. It needs no ci-ok, which stays the strict check: a
  # tier 1 lane (lanes.rb) that did not pass, or a failed `units` or
  # `smoke`, stops it; a tier 2 or 3 lane that did not pass is left out,
  # and the summary and the notes name it. A tagged release (release.yml)
  # publishes the same files to rubygems.org.
  release:
    name: "release: prerelease of this commit"
    needs: [checks, units, lane, smoke]
    if: >-
      !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.code == 'true' &&
      needs.units.result == 'success' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A push and the nightly run of one commit make one prerelease.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write # the tag and the GitHub Release
      actions: read # this run's artifacts
      id-token: write # the attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LANES: ${{ needs.checks.outputs.lanes }}
      SMOKE: ${{ needs.smoke.result }}
    steps:
      # The gemspec, for the platform gems.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
      - name: "Release: download the gem and each passed target's runtime, and build the platform gems"
        id: files
        run: |
          [ "$SMOKE" = success ] || { echo "::error::the gem's smoke test did not pass ($SMOKE)"; exit 1; }
          mkdir dist
          gh run download "$GITHUB_RUN_ID" -n gem -D dist
          gem="$(cd dist && ls zr-*.gem)"
          version="${gem#zr-}"; version="${version%.gem}"
          tag="v$version.g${GITHUB_SHA:0:7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          left=()
          for triple in $(echo "$LANES" | jq -r '.[].triple'); do
            tier="$(echo "$LANES" | jq -r --arg t "$triple" '.[] | select(.triple == $t) | .tier')"
            if gh run download "$GITHUB_RUN_ID" -n "passed-$triple" -D "passed-$triple" 2> /dev/null &&
               gh run download "$GITHUB_RUN_ID" -n "runtime-$triple" -D "lane-$triple" 2> /dev/null &&
               [ -f "lane-$triple/runtime-$triple.tar.gz" ]; then
              bundle="dist/zr-runtime-$version-$triple.tar.gz"
              mv "lane-$triple/runtime-$triple.tar.gz" "$bundle"
              platform="$(echo "$LANES" | jq -r --arg t "$triple" '.[] | select(.triple == $t) | .gem_platform // empty')"
              if [ -n "$platform" ]; then
                # The gem leaves out the walked eval support (Prebuilt::GEM_LEFT_OUT).
                rm -rf data/runtime
                ruby -Ilib -rzr/prebuilt -e 'Zr::Prebuilt.unpack(ARGV[0], ARGV[1], without: Zr::Prebuilt::GEM_LEFT_OUT)' \
                  "$bundle" "data/runtime/$triple"
                SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ZR_GEM_PLATFORM="$platform" ZR_GEM_RUNTIME="data/runtime/$triple" \
                  gem build zr.gemspec --output "dist/zr-$version-$platform.gem"
                size="$(wc -c < "dist/zr-$version-$platform.gem")"
                [ "$size" -le $((100 << 20)) ] || { echo "::error::zr-$version-$platform.gem is $((size >> 20)) MB, past 100 MB"; exit 1; }
              fi
            elif [ "$tier" = 1 ]; then
              echo "::error::$triple, a tier 1 target, did not pass: no release"; exit 1
            else
              left+=("$triple (tier $tier)")
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            echo "## Release: prerelease $tag"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            (cd dist && for f in *; do
              printf '| %s | %s | %s |\n' "$f" "$(du -h "$f" | cut -f1)" "\`$(sha256sum "$f" | cut -c1-16)…\`"
            done)
          } >> "$GITHUB_STEP_SUMMARY"
          : > left.md
          if [ ${#left[@]} -gt 0 ]; then
            { echo; echo "Not in this release: their lanes did not pass."; echo
              for t in "${left[@]}"; do echo "- $t"; done; } | tee -a "$GITHUB_STEP_SUMMARY" > left.md
          fi
      - id: exists
        name: "Release: look for the prerelease"
        env:
          TAG: ${{ steps.files.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # The attestation names this repository, this workflow and the
      # commit, for each file that the prerelease holds.
      - name: "Release: attest each file's provenance"
        if: steps.exists.outputs.found != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: "Release: publish the prerelease"
        if: steps.exists.outputs.found != 'true'
        env:
          TAG: ${{ steps.files.outputs.tag }}
          VERSION: ${{ steps.files.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > notes.md <<NOTES
          A prerelease of $GITHUB_SHA, from [CI]($RUN_URL): the gem, and the runtime bundle and platform gem of each target that this run tested and passed. It is not a release, and no gem server has it.

          A platform gem carries its host's runtime, so its first build builds none:

              gem install ./zr-$VERSION-arm64-darwin.gem

          The \`ruby\` gem builds the runtime on its first use, or takes it from this prerelease:

              gem install ./zr-$VERSION.gem
              ZR_PREBUILT_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG zr cache fetch
              gh attestation verify zr-$VERSION.gem -R $GITHUB_REPOSITORY
          NOTES
          cat left.md >> notes.md
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "zr $VERSION ($GITHUB_SHA)" --notes-file notes.md
