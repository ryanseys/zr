name: Snapshot

# After each CI run on main whose ci-ok passed, a GitHub prerelease of the
# commit that CI tested. Its version is the version in lib/zr/version.rb,
# then `.g` and the first 7 characters of the commit's SHA
# (.github/scripts/snapshot_version.rb), for example zr 0.1.0.geebf308 at
# the tag v0.1.0.geebf308. It holds the gem and its attestation. A
# snapshot goes to no gem server; a release (release.yml) does.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Two runs of CI on one commit (a push and the nightly run) make one
# snapshot: the second finds the release and stops.
concurrency:
  group: snapshot-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    # A pull request's run can have a branch named main, so only a run of
    # this repository's own events counts.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the GitHub Release
      actions: read # the jobs of the CI run
      id-token: write # the attestation
      attestations: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version

      # The run's conclusion counts the experimental jobs as passed; ci-ok
      # is the check that branch protection and the release require.
      - name: Check that the CI run's ci-ok passed
        run: |
          ok="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name == "ci-ok") | .conclusion')"
          test "$ok" = success || { echo "ci-ok of run $RUN is '$ok'"; exit 1; }

      - id: version
        name: Set the snapshot version
        run: ruby .github/scripts/snapshot_version.rb "$SHA"
      - id: exists
        name: Look for the snapshot
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the gem, and check that it installs and runs
        if: steps.exists.outputs.found != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build zr.gemspec --output "zr-$VERSION.gem"
          gem install --local --no-document --install-dir "$RUNNER_TEMP/gems" "zr-$VERSION.gem"
          got="$(GEM_HOME="$RUNNER_TEMP/gems" ruby "$RUNNER_TEMP/gems/gems/zr-$VERSION/exe/zr" version)"
          echo "$got"
          case "$got" in "zr $VERSION "*) ;; *) echo "zr version did not name $VERSION"; exit 1 ;; esac
          sha256sum "zr-$VERSION.gem" > SHA256SUMS

      # The attestation names this repository, this workflow and the
      # commit, for the exact file that the release holds.
      - name: Attest the gem's provenance
        if: steps.exists.outputs.found != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: zr-${{ steps.version.outputs.version }}.gem

      - name: Create the GitHub prerelease
        if: steps.exists.outputs.found != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > notes.md <<NOTES
          A snapshot of $SHA, after [CI]($RUN_URL) passed. It is not a release.

              gem install ./zr-$VERSION.gem
              gh attestation verify zr-$VERSION.gem -R $GITHUB_REPOSITORY
          NOTES
          gh release create "v$VERSION" "zr-$VERSION.gem" SHA256SUMS -R "$GITHUB_REPOSITORY" \
            --target "$SHA" --prerelease --latest=false --title "zr $VERSION" --notes-file notes.md
