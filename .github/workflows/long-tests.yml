name: Long tests

# The tests that a run has only with ZR_TEST_ALL (docs/reference/
# environment-variables.md): each top gem's C extension, and the tests
# that take minutes. Once a week, and by hand. CI does not run them, so
# .github/scripts/ci_passed.rb never waits for this workflow.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The wasmtime of every job (test/support/harness/wasmtime.rb, VERSION).
env:
  WASMTIME_VERSION: 49.0.2

jobs:
  long:
    name: long tests (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - uses: ./.github/actions/runtime-cache
      - name: Build the runtime
        run: bundle exec rake build
      - name: Run the long tests
        run: ZR_TEST_ALL=1 bin/minitest test/unit/core_cache_test.rb
      # The saved cache holds what this run read: a week-old restore is
      # older than a day, so each read touched its entry.
      - name: Clean the cache of what this run did not use
        run: bin/zr cache clean --days 1
      - uses: ./.github/actions/runtime-cache
        with:
          save: "true"
