name: Release

# A tag vX.Y.Z publishes zr X.Y.Z. A run by hand checks a tag and
# publishes nothing, unless `publish` is set; `only` runs one publish
# step again after a failure (docs/how-to/release.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, vX.Y.Z"
        required: true
      publish:
        description: "Publish (off: run every check, and publish nothing). Run it from the tag."
        type: boolean
        default: false
      only:
        description: "Which publish steps run"
        type: choice
        options: [all, github-release, rubygems, gem-coop]
        default: all

permissions:
  contents: read

# Two releases of one tag never run at once.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# The wasmtime of the release checks (test/support/harness/wasmtime.rb, VERSION).
env:
  WASMTIME_VERSION: 49.0.2

jobs:
  # Every check, with no environment, so a dry run works from any ref.
  # It builds the gem on the OS of CI's gem job, and the bytes must be
  # the ones that CI built and checked for the commit.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the CI run of the tagged commit, and its gem
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.notes.outputs.version }}
      sha256: ${{ steps.gem.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: ${{ env.WASMTIME_VERSION }}

      # The tag names the version in lib/zr/version.rb, and CHANGELOG.md
      # has a dated section for it, which becomes the release notes.
      - id: notes
        name: Check the tag, the version and the changelog
        run: |
          ruby .github/scripts/release_notes.rb "$TAG"
          ruby -r ./lib/zr/version -e 'puts "version=#{Zr::VERSION}"' >> "$GITHUB_OUTPUT"

      # The release runs no test tier: it requires a full CI run of this
      # commit whose ci-ok passed.
      - id: ci
        name: Check that a full CI run passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/ci_passed.rb "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)"

      - id: gem
        name: Build the gem
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build zr.gemspec --output "zr-$VERSION.gem"
          echo "sha256=$(sha256sum "zr-$VERSION.gem" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # CI keeps its gem for 90 days. After that, run CI again on the tag:
      # gh workflow run ci.yml --ref vX.Y.Z
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem
          path: ci
          run-id: ${{ steps.ci.outputs.ci_run }}
          github-token: ${{ github.token }}
      - name: The gem is the one that CI built and checked
        run: |
          sha256sum "zr-$VERSION.gem" ci/zr-*.gem
          test "$(sha256sum < "zr-$VERSION.gem")" = "$(sha256sum < ci/zr-"$VERSION".gem)"

      - name: Install the gem and run it as a user would
        run: ruby .github/scripts/smoke.rb "zr-$VERSION.gem"
      - name: Run the gem with the user cache
        run: ruby .github/scripts/smoke.rb --user-cache "zr-$VERSION.gem"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            zr-*.gem
            notes.md

  # Each tested target's built runtime (`zr cache export`), from the gem
  # that the check built, on a host that runs the target. `zr cache fetch`
  # downloads them from the release, so a user's first build takes
  # seconds, not minutes.
  bundles:
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { triple: aarch64-apple-darwin, os: macos-15 }
          - { triple: x86_64-linux-gnu, os: ubuntu-24.04 }
          - { triple: aarch64-linux-gnu, os: ubuntu-24.04-arm }
          - { triple: wasm32-wasi, os: ubuntu-24.04 }
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          sparse-checkout: .ruby-version
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      # The export builds the runtime and eval support first.
      - name: Build the runtime from the gem, and export it
        run: |
          gem install --local --no-document --install-dir "$RUNNER_TEMP/gems" "zr-$VERSION.gem"
          ZR_CACHE="$RUNNER_TEMP/cache" ruby "$RUNNER_TEMP/gems/gems/zr-$VERSION/exe/zr" cache export --target "$TRIPLE" \
            -o "zr-runtime-$VERSION-$TRIPLE.zrr"
      # A cache that has only the bundle builds a program and an eval with
      # no build of the runtime: the bundle holds all that a build reads.
      - name: Import the bundle into an empty cache, and build from it alone
        run: |
          zr="$RUNNER_TEMP/gems/gems/zr-$VERSION/exe/zr"
          export ZR_CACHE="$RUNNER_TEMP/fresh"
          ruby "$zr" cache import "zr-runtime-$VERSION-$TRIPLE.zrr"
          cd "$RUNNER_TEMP"
          echo 'puts eval("1 + 1")' > check.rb
          ruby "$zr" build --target "$TRIPLE" check.rb -o check 2> build.log || { cat build.log; exit 1; }
          if grep -q "zr: building" build.log; then cat build.log; echo "the bundle did not hold the whole runtime"; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.triple }}
          path: zr-runtime-*.zrr

  # The publish steps, in the release environment, which only v* tags may
  # use. A draft GitHub Release comes first and is published last, so a
  # failure in between leaves a draft and the `only` choice to finish.
  publish:
    needs: [check, bundles]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release
      id-token: write # trusted publishing to rubygems.org, and the attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.check.outputs.version }}
      ONLY: ${{ inputs.only || 'all' }}
    steps:
      - name: Run from the tag
        run: test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = "$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: The gem is the one that the check built
        env:
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: test "$(sha256sum "zr-$VERSION.gem" | cut -d' ' -f1)" = "$SHA256"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          merge-multiple: true
      # `zr cache fetch` checks a bundle against this list.
      - name: List the digests of the gem and the runtimes
        run: sha256sum "zr-$VERSION.gem" zr-runtime-*.zrr > SHA256SUMS

      # The attestation names this repository, this workflow and this
      # commit, for the exact file that the next steps publish.
      - name: Attest the gem's provenance
        if: env.ONLY == 'all'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            zr-${{ env.VERSION }}.gem
            zr-runtime-*.zrr

      - name: Create the GitHub Release as a draft
        if: env.ONLY == 'all' || env.ONLY == 'github-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "zr $VERSION" --notes-file notes.md --verify-tag
          gh release upload "$TAG" "zr-$VERSION.gem" zr-runtime-*.zrr SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber

      # Trusted publishing: no API key. rubygems attests the push with
      # sigstore on its own under GitHub Actions; check the attestation on
      # rubygems.org after the first release (docs/how-to/release.md).
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: env.ONLY == 'all' || env.ONLY == 'rubygems' || env.ONLY == 'gem-coop'
        with:
          ruby-version: "4.0"
      - name: Configure trusted publishing to rubygems.org
        if: env.ONLY == 'all' || env.ONLY == 'rubygems'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push to rubygems.org
        if: env.ONLY == 'all' || env.ONLY == 'rubygems'
        run: gem push "zr-$VERSION.gem"

      # gem.coop's own index mirrors rubygems.org; a direct push goes to a
      # namespace. The key is a push-only key for it, in the release
      # environment.
      - name: Push to gem.coop (@ryanseys)
        if: env.ONLY == 'all' || env.ONLY == 'gem-coop'
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_COOP_API_KEY }}
        run: gem push --host https://gem.coop/@ryanseys "zr-$VERSION.gem"

      - name: Publish the GitHub Release
        if: env.ONLY == 'all' || env.ONLY == 'github-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
