name: Release

# A tag vX.Y.Z publishes zr X.Y.Z. A run by hand checks a tag and
# publishes nothing, unless `publish` is set; `only: gem-coop` pushes
# an already published version to gem.coop again.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, vX.Y.Z"
        required: true
      publish:
        description: "Publish (off: run every check, and publish nothing)"
        type: boolean
        default: false
      only:
        description: "Which publish steps run"
        type: choice
        options: [all, gem-coop]
        default: all

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write # the GitHub Release
      id-token: write # trusted publishing to rubygems.org, and the attestation
      attestations: write
      checks: read # the CI result of the tagged commit
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      ONLY: ${{ inputs.only || 'all' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1

      # The tag names the version in lib/zr/version.rb, and CHANGELOG.md
      # has a dated section for it, which becomes the release notes.
      - name: Check the tag, the version and the changelog
        run: |
          version="$(ruby -Ilib -rzr/version -e 'print Zr::VERSION')"
          ruby -e 'abort "the tag is #{ARGV[0]}, but Zr::VERSION is #{ARGV[1]}" unless ARGV[0] == "v#{ARGV[1]}"' "$TAG" "$version"
          ruby tool/changelog.rb "$version" > notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Publish only a commit whose every CI job passed.
      - name: Check that CI passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/ci_passed.rb "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)"

      # The release's own checks, whatever CI said: the unit tier, then
      # the gem as a user installs and runs it.
      - name: Run the unit tests
        run: bin/test test/unit
      # rubygems stamps a gem's files with SOURCE_DATE_EPOCH, so the same
      # commit builds the same .gem as CI did.
      - name: Build the gem
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build zr.gemspec --output "zr-$VERSION.gem"
      - name: Install the gem and run it as a user would
        run: ruby .github/scripts/smoke.rb "zr-$VERSION.gem" /opt/zr

      # The attestation names this repository, this workflow and this
      # commit, for the exact file that the next steps publish.
      - name: Attest the gem's provenance
        if: env.PUBLISH == 'true' && env.ONLY == 'all'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: zr-${{ env.VERSION }}.gem
      # Trusted publishing: no API key. rubygems 4 attests the push with
      # sigstore on its own under GitHub Actions.
      - name: Configure trusted publishing to rubygems.org
        if: env.PUBLISH == 'true' && env.ONLY == 'all'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push to rubygems.org
        if: env.PUBLISH == 'true' && env.ONLY == 'all'
        run: gem push "zr-$VERSION.gem"

      # gem.coop's own index mirrors rubygems.org; a direct push goes to a
      # namespace. The key is a push-only key for it, in the release
      # environment. If this step fails, run the workflow by hand with
      # `only: gem-coop` and `publish` set.
      - name: Push to gem.coop (@ryanseys)
        if: env.PUBLISH == 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_COOP_API_KEY }}
        run: gem push --host https://gem.coop/@ryanseys "zr-$VERSION.gem"

      - name: Create the GitHub Release
        if: env.PUBLISH == 'true' && env.ONLY == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "zr-$VERSION.gem" --title "zr $VERSION" --notes-file notes.md --verify-tag
