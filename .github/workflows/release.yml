name: Release

# A tag vX.Y.Z publishes zr X.Y.Z. The tag of a prerelease (ci.yml's
# `release` job, vX.Y.Z.g<sha>) does not match. A run by hand checks a
# tag and publishes nothing, unless `publish` is set; `only` runs one
# publish step again after a failure (docs/how-to/release.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, vX.Y.Z"
        required: true
      publish:
        description: "Publish (off: run every check, and publish nothing). Run it from the tag."
        type: boolean
        default: false
      only:
        description: "Which publish steps run"
        type: choice
        options: [all, github-release, rubygems]
        default: all

permissions:
  contents: read

# Two releases of one tag never run at once.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# The wasmtime of the release checks (test/support/harness/wasmtime.rb, VERSION).
env:
  WASMTIME_VERSION: 49.0.2

jobs:
  # Every check, with no environment, so a dry run works from any ref.
  # The files are the ones of the commit's prerelease (ci.yml's `release`
  # job): the `ruby` gem, each passed target's runtime bundle and platform
  # gem, and SHA256SUMS, which CI built, tested and attested. The gem
  # built here on the OS of CI's gem job must be the same bytes.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the CI run of the tagged commit
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.notes.outputs.version }}
      sha256: ${{ steps.gem.outputs.sha256 }}
      lanes: ${{ steps.lanes.outputs.lanes }}
      ci_run: ${{ steps.ci.outputs.ci_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: ${{ env.WASMTIME_VERSION }}

      # The tag names the version in lib/zr/version.rb, and CHANGELOG.md
      # has a dated section for it, which becomes the release notes.
      - id: notes
        name: Check the tag, the version and the changelog
        run: |
          ruby .github/scripts/release_notes.rb "$TAG"
          ruby -r ./lib/zr/version -e 'puts "version=#{Zr::VERSION}"' >> "$GITHUB_OUTPUT"

      # The release runs no test tier: it requires a CI run of this commit
      # whose release job passed, which every tier 1 lane did.
      - id: ci
        name: Check that CI passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/ci_passed.rb "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)"

      # Each target of CI's lanes (.github/scripts/lanes.rb).
      - id: lanes
        name: The targets whose runtimes the release can carry
        run: echo "lanes=$(ruby .github/scripts/lanes.rb matrix | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Download the commit's prerelease, and check its digests
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          pre="v$VERSION.g$(git rev-parse --short=7 HEAD)"
          gh release download "$pre" -D pre ||
            { echo "::error::no prerelease $pre: run CI on the commit (gh workflow run ci.yml --ref $TAG)"; exit 1; }
          (cd pre && sha256sum -c SHA256SUMS)
          ls -la pre

      - id: gem
        name: Build the gem, which must be the prerelease's
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" gem build zr.gemspec --output "zr-$VERSION.gem"
          sha256sum "zr-$VERSION.gem" "pre/zr-$VERSION.gem"
          test "$(sha256sum < "zr-$VERSION.gem")" = "$(sha256sum < "pre/zr-$VERSION.gem")"
          echo "sha256=$(sha256sum "zr-$VERSION.gem" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Install the gem and run it as a user would
        run: ruby .github/scripts/smoke.rb "zr-${{ steps.notes.outputs.version }}.gem"
      - name: Run the gem with the user cache
        run: ruby .github/scripts/smoke.rb --user-cache "zr-${{ steps.notes.outputs.version }}.gem"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            pre/zr-*.gem
            pre/zr-runtime-*.tar.gz
            notes.md

  # Each target's files on a runner of that target, as a user takes them:
  # its platform gem installed in an empty GEM_HOME, which must build a
  # program and an eval with no build of the runtime; for wasm32-wasi,
  # the bundle imported into an empty cache. A target that the
  # prerelease left out (a tier 2 or 3 lane that did not pass) has
  # nothing to check, and the release leaves it out too. A musl lane
  # tested its files in its Alpine container.
  bundles:
    name: bundle (${{ matrix.lane.triple }})
    needs: check
    runs-on: ${{ matrix.lane.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.check.outputs.lanes) }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TRIPLE: ${{ matrix.lane.triple }}
      PLATFORM: ${{ matrix.lane.gem_platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          sparse-checkout: .ruby-version
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - id: has
        name: The target's files in the prerelease
        run: |
          if [ -f "pre/zr-runtime-$VERSION-$TRIPLE.tar.gz" ]; then echo "files=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.lane.tier }}" = 1 ]; then echo "::error::the prerelease has no $TRIPLE, a tier 1 target"; exit 1
          else echo "::notice::$TRIPLE is not in this release: its lane did not pass"
          fi
      - name: Build from the platform gem alone, with an empty cache
        if: steps.has.outputs.files == 'true' && !matrix.lane.container && matrix.lane.gem_platform
        run: |
          gem install --local --no-document --install-dir "$RUNNER_TEMP/gems" "pre/zr-$VERSION-$PLATFORM.gem"
          zr="$RUNNER_TEMP/gems/gems/zr-$VERSION-$PLATFORM/exe/zr"
          export XDG_CACHE_HOME="$RUNNER_TEMP/fresh" GEM_HOME="$RUNNER_TEMP/gems"
          cd "$RUNNER_TEMP"
          echo 'puts eval("1 + 1")' > check.rb
          ruby "$zr" build check.rb -o check 2> build.log || { cat build.log; exit 1; }
          if grep -q "zr: building" build.log; then cat build.log; echo "the platform gem did not carry the whole runtime"; exit 1; fi
          test "$(./check)" = 2
      - name: Import the bundle into an empty cache, and build from it alone
        if: steps.has.outputs.files == 'true' && !matrix.lane.container && !matrix.lane.gem_platform
        run: |
          gem install --local --no-document --install-dir "$RUNNER_TEMP/gems" "pre/zr-$VERSION.gem"
          zr="$RUNNER_TEMP/gems/gems/zr-$VERSION/exe/zr"
          export ZR_CACHE="$RUNNER_TEMP/fresh"
          ruby "$zr" cache import "pre/zr-runtime-$VERSION-$TRIPLE.tar.gz"
          cd "$RUNNER_TEMP"
          echo 'puts eval("1 + 1")' > check.rb
          ruby "$zr" build --target "$TRIPLE" check.rb -o check 2> build.log || { cat build.log; exit 1; }
          if grep -q "zr: building" build.log; then cat build.log; echo "the bundle did not hold the whole runtime"; exit 1; fi

  # The publish steps, in the release environment, which only v* tags may
  # use. A draft GitHub Release comes first and is published last, so a
  # failure in between leaves a draft and the `only` choice to finish.
  publish:
    needs: [check, bundles]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release
      id-token: write # trusted publishing to rubygems.org, and the attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.check.outputs.version }}
      ONLY: ${{ inputs.only || 'all' }}
    steps:
      - name: Run from the tag
        run: test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = "$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: The gem is the one that the check built
        env:
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: |
          mv pre/* . && rmdir pre
          test "$(sha256sum "zr-$VERSION.gem" | cut -d' ' -f1)" = "$SHA256"
      # `zr cache fetch` checks a bundle against this list.
      - name: List the digests of the gems and the runtimes
        run: sha256sum zr-*.gem zr-runtime-*.tar.gz > SHA256SUMS

      # The attestation names this repository, this workflow and this
      # commit, for the exact file that the next steps publish.
      - name: Attest the gem's provenance
        if: env.ONLY == 'all'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            zr-*.gem
            zr-runtime-*.tar.gz

      - name: Create the GitHub Release as a draft
        if: env.ONLY == 'all' || env.ONLY == 'github-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "zr $VERSION" --notes-file notes.md --verify-tag
          gh release upload "$TAG" zr-*.gem zr-runtime-*.tar.gz SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber

      # Trusted publishing: no API key. rubygems attests the push with
      # sigstore on its own under GitHub Actions; check the attestation on
      # rubygems.org after the first release (docs/how-to/release.md).
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: env.ONLY == 'all' || env.ONLY == 'rubygems'
        with:
          ruby-version: "4.0"
      - name: Configure trusted publishing to rubygems.org
        if: env.ONLY == 'all' || env.ONLY == 'rubygems'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      # The platform gems first and the `ruby` gem last, as nokogiri
      # pushes: a host that resolves zr between the pushes then finds its
      # platform gem, not only the `ruby` one. A version's gem that is
      # already there is skipped, so a run again finishes the rest. The
      # status is gem push's own: a pipe into tee would give tee's, and the
      # step's shell has no pipefail.
      - name: Push to rubygems.org
        if: env.ONLY == 'all' || env.ONLY == 'rubygems'
        run: |
          for gem in $(ls zr-"$VERSION"-*.gem 2> /dev/null) "zr-$VERSION.gem"; do
            if gem push "$gem" > push.log 2>&1; then
              cat push.log
            else
              cat push.log
              grep -q "Repushing of gem versions is not allowed" push.log || exit 1
            fi
          done

      - name: Publish the GitHub Release
        if: env.ONLY == 'all' || env.ONLY == 'github-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false

  # The release as a user takes it, from rubygems.org and the published
  # GitHub Release, on a runner of each target that has a platform gem
  # (a musl lane's runner is not musl). `gem install zr` must take the
  # platform gem and build a program with no build of the runtime; the
  # `ruby` gem must take the runtime with `zr cache fetch` from its
  # default URL. rubygems.org serves a new version a few minutes after
  # the push, so the install tries again for 15 minutes. It runs after a
  # full release only: `only` leaves a step for later.
  installed:
    name: installed (${{ matrix.lane.triple }})
    needs: [check, publish]
    if: needs.publish.result == 'success' && (inputs.only || 'all') == 'all'
    runs-on: ${{ matrix.lane.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.check.outputs.lanes) }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TRIPLE: ${{ matrix.lane.triple }}
      PLATFORM: ${{ matrix.lane.gem_platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: "!matrix.lane.container && matrix.lane.gem_platform"
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          sparse-checkout: .ruby-version
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: "!matrix.lane.container && matrix.lane.gem_platform"
        with:
          ruby-version: .ruby-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: "!matrix.lane.container && matrix.lane.gem_platform"
        with:
          name: release
      - id: has
        name: The target's platform gem in the release
        if: "!matrix.lane.container && matrix.lane.gem_platform"
        run: |
          if [ -f "pre/zr-$VERSION-$PLATFORM.gem" ]; then echo "gem=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::the release has no $PLATFORM gem"
          fi
      - name: Install the platform gem from rubygems.org, and build with an empty cache
        if: steps.has.outputs.gem == 'true'
        run: |
          export GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems" XDG_CACHE_HOME="$RUNNER_TEMP/fresh"
          for try in $(seq 30); do
            gem install --no-document zr -v "$VERSION" && break
            test "$try" = 30 && exit 1
            echo "rubygems.org does not serve zr $VERSION yet; try $try of 30"
            sleep 30
          done
          test -d "$GEM_HOME/gems/zr-$VERSION-$PLATFORM" || { ls "$GEM_HOME/gems"; echo "gem install did not take the $PLATFORM gem"; exit 1; }
          cd "$RUNNER_TEMP"
          echo 'puts "Hello, world!"' > hello.rb
          "$GEM_HOME/bin/zr" build hello.rb -o hello 2> build.log || { cat build.log; exit 1; }
          if grep -q "zr: building" build.log; then cat build.log; echo "the platform gem did not carry the whole runtime"; exit 1; fi
          test "$(./hello)" = "Hello, world!"
      - name: Install the ruby gem from rubygems.org, and fetch the release's runtime
        if: steps.has.outputs.gem == 'true'
        run: |
          export GEM_HOME="$RUNNER_TEMP/ruby-gem" GEM_PATH="$RUNNER_TEMP/ruby-gem" XDG_CACHE_HOME="$RUNNER_TEMP/fetched"
          gem install --no-document zr -v "$VERSION" --platform ruby
          test -d "$GEM_HOME/gems/zr-$VERSION" || { ls "$GEM_HOME/gems"; echo "gem install did not take the ruby gem"; exit 1; }
          "$GEM_HOME/bin/zr" cache fetch
          cd "$RUNNER_TEMP"
          echo 'puts "Hello, world!"' > hello.rb
          "$GEM_HOME/bin/zr" build hello.rb -o hello 2> build.log || { cat build.log; exit 1; }
          if grep -q "zr: building" build.log; then cat build.log; echo "zr cache fetch did not take the whole runtime"; exit 1; fi
          test "$(./hello)" = "Hello, world!"
