version: 2
# Dependabot updates neither WASMTIME_VERSION in the workflows (it is
# test/support/harness/wasmtime.rb's VERSION) nor the ruby:<pin>-alpine
# image of the linux-musl job (it is .ruby-version). An update waits 7
# days after its release.
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
  # The gem has no runtime dependencies, so each of these is a tool of the
  # checkout (RuboCop, Steep, minitest): one pull request a month for all.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(dev)
    groups:
      development:
        patterns: ["*"]
