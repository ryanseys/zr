inherit_from: .rubocop_todo.yml
# The todo's Exclude lists add to the ones here.
inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-thread_safety

# The Lint cops find bugs (unused values, shadowed names, unreachable
# code). Each other cop below is on for a reason that it gives.
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  DisabledByDefault: true
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"       # third-party code
    - "benchmark/**/*"    # programs that zr compiles
    - "test/programs/**/*"
    - "test/gaps/**/*"    # programs compared with ruby's output, as above
    - "test/fixtures/**/*"
    - "test/runtime/**/*"
    - "test/machine/**/*"
    - "test/hir/**/*"     # input programs for the HIR snapshots
    - ".claude/worktrees/**/*"
    - "gems/**/*"         # the gem probes that zr compiles
    - "tmp/**/*"
    - "log/**/*"          # logs and the fuzzer's saved cases
    - "lib/zr/hir/features.rb"      # generated
    - "lib/zr/library/stdlib.rb"    # generated

Lint:
  Enabled: true

# Off: these report deliberate choices in this code, not bugs.
Lint/AmbiguousOperatorPrecedence: { Enabled: false } # style
Lint/AmbiguousBlockAssociation: { Enabled: false }   # style
Lint/DuplicateBranch: { Enabled: false }             # a case keeps one branch per form
Lint/MissingSuper: { Enabled: false }                # a record's initialize can set its own fields
Lint/UselessConstantScoping: { Enabled: false }      # style
Lint/RedundantDirGlobSort: { Enabled: false }        # zr's own Dir.glob, in a compiled compiler, may not sort
Lint/HashCompareByIdentity: { Enabled: false }       # style
Lint/BooleanSymbol: { Enabled: false }               # the compiler handles :true and :false as symbols
Lint/EmptyBlock: { Enabled: false }                  # an empty task body is deliberate
Lint/NonAtomicFileOperation: { Enabled: false }      # style
Lint/NonLocalExitFromIterator: { Enabled: false }    # a return from a File.open block is deliberate
Lint/InterpolationCheck: { Enabled: false }          # tests write Ruby source in single quotes
Lint/InheritException: { Enabled: false }            # the eval interpreter's control flow is not a StandardError
Lint/StructNewOverride: { Enabled: false }           # test fixtures

# A method that takes a keyword for its interface need not read it. A
# kernel def takes each parameter that its sig names, also one that an
# OS layer does not need.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
  Exclude: ["lib/zr/runtime/kernel/**/*"]
# In the kernel, `RProc.lambda(p)` reads a struct field, and `d != d` is
# the NaN test.
Lint/LambdaWithoutLiteralBlock: { Exclude: ["lib/zr/runtime/kernel/**/*"] }
Lint/BinaryOperatorWithIdenticalOperands: { Exclude: ["lib/zr/runtime/kernel/**/*"] }

# Off for the runtime, which mirrors CRuby and its upstream ports:
# - nkf's TRUE and FALSE and Marshal's type tags are their names in C.
Lint/DeprecatedConstants: { Exclude: ["lib/zr/runtime/**/*"] }
# - an enumerator's size block counts the `given` pattern's arguments
#   exactly, which the cop cannot see.
Lint/ToEnumArguments: { Exclude: ["lib/zr/runtime/**/*"] }
# - `self` as the value of initialize, and a setter or `[]=` that returns
#   its value, mirror the C function, whose value `send` returns.
Lint/Void: { Exclude: ["lib/zr/runtime/**/*"] }
Lint/ReturnInVoidContext: { Exclude: ["lib/zr/runtime/**/*"] }
# - `def dup = super` gives the method the owner that CRuby reports.
Lint/UselessMethodDefinition: { Exclude: ["lib/zr/runtime/**/*"] }
# - Float's own methods compare floats exactly, as C does.
Lint/FloatComparison: { Exclude: ["lib/zr/runtime/**/*"] }
# - a thread, a callback or a parser stops on any exception, as its C
#   does, and gives it on.
Lint/RescueException: { Exclude: ["lib/zr/runtime/**/*"] }

# The runtime (lib/zr/runtime) gets the Lint cops only. Its kernel is
# typed Ruby that zr lowers and `Machine::Host` (lib/zr/machine/host.rb)
# runs on ruby too; its core, ext and lib follow upstream code (onigmo,
# prism, psych, the openssl port) and CRuby's C, line for line. A cop
# with an Exclude of its own names the runtime there too, because a
# cop's list replaces its department's.
Layout: { Exclude: ["lib/zr/runtime/**/*"] }
Style: { Exclude: ["lib/zr/runtime/**/*", "test/**/*"] }
Naming: { Exclude: ["lib/zr/runtime/**/*"] }
Metrics: { Exclude: ["lib/zr/runtime/**/*"] }

# Layout: only what keeps a diff readable. No formatter, so blame stays.
Layout/LineLength:
  Enabled: true
  Max: 150
Layout/TrailingWhitespace: { Enabled: true, AllowInHeredoc: true } # heredocs are programs and outputs
Layout/EmptyLines: { Enabled: true }
Layout/SpaceAroundOperators: { Enabled: true }
# The kernel has no such comment: zr lowers its literals to bytes, so it
# has no String to freeze. test/unit/frozen_string_literal_test.rb checks
# the runtime's core, ext and lib, which this file excludes.
Style/FrozenStringLiteralComment: { Enabled: true }

# The Minitest cops keep one form for each assertion. The form gives the
# better failure message: assert_predicate names the receiver, and
# assert_path_exists names the path.
Minitest:
  Enabled: true
  Exclude: ["lib/zr/runtime/**/*"]
Minitest/MultipleAssertions: { Enabled: false }              # a test checks one behavior, with its parts
Minitest/EmptyLineBeforeAssertionMethods: { Enabled: false } # layout
Minitest/AssertWithExpectedArgument: { Enabled: false }      # assert(x, message) is the form it flags

# The Performance cops find an allocation or a call that the code does
# not need. The compiler's own speed is a feature.
Performance:
  Enabled: true
  Exclude: ["lib/zr/runtime/**/*"]
# One pass, with no Array between a select and a map.
Performance/SelectMap: { Enabled: true }
# A literal list in a loop of a test or a generator runs a few times;
# in lib/ a loop can be hot.
Performance/CollectionLiteralInLoop:
  Exclude:
    - "lib/zr/runtime/**/*"
    - "test/**/*"
    - "tool/**/*"

# One quote style. The code uses double quotes, also inside #{}.
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

# A ternary inside a ternary is hard to read; an if or a case says it.
Style/NestedTernaryOperator: { Enabled: true }

# attr_reader for a reader that only returns its variable.
Style/TrivialAccessors: { Enabled: true }

# The method of the core library that says what the block does.
Style/ArrayIntersect: { Enabled: true }      # a.intersect?(b)
Style/CollectionCompact: { Enabled: true }   # compact
Style/HashExcept: { Enabled: true }          # except
Style/HashSlice: { Enabled: true }           # slice
Style/InverseMethods: { Enabled: true }      # reject, not select { !... }
Style/MapToSet: { Enabled: true }            # to_set { }
Style/SelectByRange: { Enabled: true }       # grep and grep_v
Style/SymbolProc: { Enabled: true }          # &:name

# One statement to a line; a semicolon hides the second one.
Style/Semicolon:
  Enabled: true
  # The zr-dev command tables: `-> { require_relative "gen"; Gen }`
  # loads a command when it runs. The require stays literal, so that zr
  # finds the file when it compiles the tools.
  Exclude:
    - "lib/zr/runtime/**/*"
    - "tool/commands.rb"
    - "tool/gen.rb"
    - "tool/gems.rb"
# lambda.call(x), not lambda.(x).
Style/LambdaCall: { Enabled: true }

# A block that a method only passes on needs no name: `def f(&) = g(&)`.
Naming/BlockForwarding: { Enabled: true }
# Arguments that a method only passes on go as `...`. The cop does not
# ask for an anonymous `*` or `**` in place of a name: Steep stops on an
# anonymous `**` (`bin/steep check`), so a method names its keywords.
# zr compiles the anonymous forms all the same
# (test/programs/lang/methods/definition/anonymous_*).
Style/ArgumentsForwarding: { Enabled: true, UseAnonymousForwarding: false }

# A constant that code changes is state; an object or a variable owns it.
Style/MutableConstant: { Enabled: true }

# `x rescue nil` rescues every StandardError, also a bug's NoMethodError.
# Name the error that you expect (docs/explanation/ruby-style.md).
Style/RescueModifier: { Enabled: true }

# A method that answers true or false ends in ?. `run` is the zr-dev
# Command protocol: its false is the exit status 1 (Command#start).
Naming/PredicateMethod:
  Enabled: true
  AllowedMethods: [call, run]

# State on a class or a module is shared by every thread: the server,
# the test workers and the host machine run threads. An object owns its
# state; a process-wide memo goes in Zr::Session. Dir.chdir changes the
# directory of every thread. NewThread stays off: zr starts threads on
# purpose (the host's timer, the test pools).
ThreadSafety:
  Enabled: true
  Exclude: ["lib/zr/runtime/**/*"]
ThreadSafety/NewThread: { Enabled: false }
ThreadSafety/RackMiddlewareInstanceVariable: { Enabled: false } # no Rack

# `f(x, true)` does not say what `true` means; `f(x, wide: true)` does.
Style/OptionalBooleanParameter: { Enabled: true }

# A long positional list hides which argument is which. Pass a record
# (a Data) or keywords. A kernel def's parameters are its machine
# signature, so the kernel is out (Metrics, above).
Metrics/ParameterLists:
  Enabled: true
  Max: 5
  CountKeywordArgs: false
  MaxOptionalParameters: 3
